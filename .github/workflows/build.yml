name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q StatusPrep.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
        working-directory: StatusPrep
      - uses: actions/upload-artifact@v4
        with:
          name: StatusPrep-apk
          path: StatusPrep/app/build/outputs/apk/debug/*.apk
